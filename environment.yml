name: eeg

channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  # Python
  - python=3.10

  # PyTorch with CUDA (change cudatoolkit version to match your cluster)
  - pytorch>=2.0
  - torchvision
  - torchaudio
  - pytorch-cuda=11.8        # <-- change to 12.1 if your cluster has CUDA 12

  # Scientific stack
  - numpy
  - pandas
  - scipy
  - matplotlib
  - scikit-learn
  - tqdm

  # pip-only packages
  - pip
  - pip:
      - braindecode>=0.8
      - eegdash                # EEG 2025 challenge package
      - mne>=1.6